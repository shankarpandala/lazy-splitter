                  latest_tuple = parse_version_tuple(latest_stable)
                  pypi_next = (latest_tuple[0], latest_tuple[1], latest_tuple[2] + 1)
                  next_base = max(current_base, pypi_next)
          except Exception as exc:
              print(f'Could not resolve latest stable from PyPI ({exc}); using pyproject base.')

          stable_version = '.'.join(str(part) for part in next_base)
          updated = re.sub(
              r'^version\s*=\s*"([^"]+)"',
              f'version = "{stable_version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          pyproject.write_text(updated, encoding='utf-8')
          print(f'Stable version set to: {stable_version}')
          PY

      - name: Build package
        run: python -m build

      - name: Publish release to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
