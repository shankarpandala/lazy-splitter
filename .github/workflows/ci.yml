name: CI/CD

on:
  push:
    branches: [main, dev, qa, release]
  pull_request:
    branches: [main, dev, qa, release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest --cov=pdf_splitter --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run flake8
        run: flake8 src/

      - name: Run black check
        run: black --check src/

      - name: Run mypy
        run: mypy src/

  publish-alpha:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Set alpha version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          PRE_TAG: a
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          pyproject = Path('pyproject.toml')
          content = pyproject.read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"([^"]+)"', content, flags=re.MULTILINE)
          if not match:
              raise SystemExit('Could not find [project].version in pyproject.toml')

          stable_version = match.group(1)
          base_match = re.match(r'^(\d+\.\d+\.\d+)', stable_version)
          if not base_match:
              raise SystemExit(f'Unsupported version format: {stable_version}')

          base_version = base_match.group(1)
          prerelease_version = f"{base_version}{os.environ['PRE_TAG']}{os.environ['RUN_NUMBER']}"
          updated = re.sub(
              r'^version\s*=\s*"([^"]+)"',
              f'version = "{prerelease_version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          pyproject.write_text(updated, encoding='utf-8')
          print(f"Prerelease version set to: {prerelease_version}")
          PY

      - name: Build alpha package
        run: python -m build

      - name: Publish alpha to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

  publish-beta:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Set beta version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          PRE_TAG: b
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          pyproject = Path('pyproject.toml')
          content = pyproject.read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"([^"]+)"', content, flags=re.MULTILINE)
          if not match:
              raise SystemExit('Could not find [project].version in pyproject.toml')

          stable_version = match.group(1)
          base_match = re.match(r'^(\d+\.\d+\.\d+)', stable_version)
          if not base_match:
              raise SystemExit(f'Unsupported version format: {stable_version}')

          base_version = base_match.group(1)
          prerelease_version = f"{base_version}{os.environ['PRE_TAG']}{os.environ['RUN_NUMBER']}"
          updated = re.sub(
              r'^version\s*=\s*"([^"]+)"',
              f'version = "{prerelease_version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          pyproject.write_text(updated, encoding='utf-8')
          print(f"Prerelease version set to: {prerelease_version}")
          PY

      - name: Build beta package
        run: python -m build

      - name: Publish beta to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

  publish-release:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish release to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
