name: CI/CD

on:
  push:
    branches: [main, dev, qa, release]
  pull_request:
    branches: [main, dev, qa, release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest --cov=pdf_splitter --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run flake8
        run: flake8 src/

      - name: Run black check
        run: black --check src/

      - name: Run mypy
        run: mypy src/

  publish-alpha:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Set alpha version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          PRE_TAG: a
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          from urllib.request import urlopen

          pyproject = Path('pyproject.toml')
          content = pyproject.read_text(encoding='utf-8')
          version_match = re.search(r'^version\s*=\s*"([^"]+)"', content, flags=re.MULTILINE)
          if not version_match:
              raise SystemExit('Could not find [project].version in pyproject.toml')
          name_match = re.search(r'^name\s*=\s*"([^"]+)"', content, flags=re.MULTILINE)
          if not name_match:
              raise SystemExit('Could not find [project].name in pyproject.toml')

          current_version = version_match.group(1)
          current_base_match = re.match(r'^(\d+)\.(\d+)\.(\d+)', current_version)
          if not current_base_match:
              raise SystemExit(f'Unsupported version format: {current_version}')
          current_base = tuple(int(part) for part in current_base_match.groups())
          package_name = name_match.group(1)

          def parse_version_tuple(version: str) -> tuple[int, int, int]:
              major, minor, patch = version.split('.')
              return int(major), int(minor), int(patch)

          next_base = current_base
          try:
              with urlopen(f'https://pypi.org/pypi/{package_name}/json', timeout=15) as response:
                  data = json.load(response)
              stable_versions = [
                  version for version in data.get('releases', {})
                  if re.fullmatch(r'\d+\.\d+\.\d+', version)
              ]
              if stable_versions:
                  latest_stable = max(stable_versions, key=parse_version_tuple)
                  latest_tuple = parse_version_tuple(latest_stable)
                  pypi_next = (latest_tuple[0], latest_tuple[1], latest_tuple[2] + 1)
                  next_base = max(current_base, pypi_next)
          except Exception as exc:
              print(f'Could not resolve latest stable from PyPI ({exc}); using pyproject base.')

          next_base_version = '.'.join(str(part) for part in next_base)
          prerelease_version = f"{next_base_version}{os.environ['PRE_TAG']}{os.environ['RUN_NUMBER']}"
          updated = re.sub(
              r'^version\s*=\s*"([^"]+)"',
              f'version = "{prerelease_version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          pyproject.write_text(updated, encoding='utf-8')
          print(f'Prerelease version set to: {prerelease_version}')
          PY

      - name: Build alpha package
        run: python -m build

      - name: Publish alpha to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

